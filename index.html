<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Links para o PWA (Instalação no Celular) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="icone-192.png">

<!-- Registro do Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registrado!'))
        .catch(err => console.error('Erro no Service Worker', err));
    });
  }
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JR Cifras</title>
<style>
  :root { --primary: #0284c7; --bg: #f8fafc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #e2e8f0; color: #1e293b; padding: 20px; }
  
  .no-print {
    width: 100%; margin: 0 auto 20px auto; background: white; padding: 20px; border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  
  .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
  .header-actions h1 { font-size: 1.5rem; color: #0f172a; }
  .btn-group { display: flex; gap: 8px; align-items: center; }
  
  button, .btn-label { padding: 10px 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 13.33px; text-align: center; }
  .btn-primary { background: #0284c7; color: white; }
  .btn-primary:hover { background: #0369a1; }
  .btn-success { background: #16a34a; color: white; }
  .btn-success:hover { background: #15803d; }
  .btn-danger { background: #dc2626; color: white; padding: 6px 10px; font-size: 12px; }
  .btn-warning { background: #d97706; color: white; }
  
  /* Layout Principal */
  .songs-container { display: flex; gap: 20px; }
  .sidebar-wrapper { width: 300px; display: flex; flex-direction: column; gap: 10px; }
  .song-list-sidebar { background: #f1f5f9; border-radius: 8px; padding: 10px; border: 1px solid #cbd5e1; height: 600px; overflow-y: auto; width: 100%; }
  .editor-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; }
  
  /* Formatação para Celular/Tablet */
  @media (max-width: 850px) {
    body { padding: 10px; }
    .header-actions { flex-direction: column; align-items: stretch; gap: 15px; }
    .header-actions > div { justify-content: space-between; }
    .btn-group { flex-wrap: wrap; justify-content: stretch; }
    .btn-group > * { flex: 1; min-width: 45%; }
    
    .songs-container { flex-direction: column; }
    .sidebar-wrapper { width: 100%; }
    .song-list-sidebar { height: 250px; } /* Menor no celular para sobrar tela */
    .grid { grid-template-columns: 1fr !important; }
    .form-group { grid-column: span 1 !important; }
  }
  
  /* Drag and Drop Styles */
  .song-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #cbd5e1; cursor: grab; }
  .song-item.active { border-left: 4px solid #0284c7; background: #e0f2fe; }
  .song-item-title { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
  .drag-handle { color: #94a3b8; font-size: 16px; cursor: grab; }
  
  /* Grid de Inputs */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 12px; font-weight: bold; color: #64748b; text-transform: uppercase; }
  .form-group input, .form-group select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px;}
  
  .transpose-controls { display: flex; align-items: center; gap: 6px; }
  .btn-transpose { background: #e2e8f0; color: #1e293b; padding: 8px 14px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 4px; cursor: pointer; }
  .transpose-val { font-weight: bold; font-size: 16px; width: 30px; text-align: center; color: #0284c7; }
  
  .text-areas textarea { width: 100%; height: 400px; font-family: monospace; font-size: 14px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 4px; white-space: pre; resize: vertical; }
  
  /* A4 Preview Canvas */
  .preview-section { margin-top: 30px; }
  .preview-title { text-align: center; color: #475569; margin-bottom: 15px; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; }
  .a4-wrapper { display: flex; flex-direction: column; align-items: center; gap: 30px; padding-bottom: 40px; position: relative; overflow-x: auto; }
  
  .a4-page {
    background: white; width: 210mm; height: 297mm; padding: 15mm 14mm 15mm 14mm;
    box-shadow: 0 10px 20px rgba(0,0,0,0.15); color: black; position: relative;
    box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; transition: background-color 0.3s, color 0.3s;
    /* Adaptação para caber na tela do celular */
    max-width: 100%; height: auto; min-height: 297mm;
  }
  
  @media screen {
      .hidden-preview { position: absolute !important; left: -9999px !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }
  }
  
  .a4-content-area { width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  
  /* Document Styling */
  .doc-header { border-bottom: 2px solid #0284c7; padding-bottom: 6px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
  .doc-title { font-size: 18pt; font-weight: 800; text-transform: uppercase; line-height: 1.1; color: #000; }
  .doc-meta { display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap;}
  .meta-left { font-size: 11pt; font-weight: 600; color: #475569; }
  .meta-left .separator { color: #cbd5e1; margin: 0 4px; font-weight: normal; }
  .tone-badge { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
  .badges { display: flex; gap: 6px; }
  .badge { color: white !important; text-decoration: none; font-size: 9pt; font-weight: bold; padding: 3px 8px; border-radius: 4px; display: none; }
  
  .doc-body { flex: 1; min-height: 0; width: 100%; display: block; padding-bottom: 5px; } 
  .cifra-content { font-family: 'Consolas', 'Courier New', monospace; font-size: 10pt; line-height: 1.25; white-space: pre; color: #000000; overflow: visible; }
  .chord { color: #d97706 !important; font-weight: bold !important; }
  hr.divider { border: 0; border-top: 2px solid #000000; margin: 10px 0 20px 0; }
  .split-block { display: flex; width: 100%; gap: 15px; margin-bottom: 2px; }
  .split-col { flex: 1; min-width: 0; }
  .split-col-divider { width: 1px; border-left: 2px solid #000000; margin: 0 15px; flex-shrink: 0; }

  /* MODO ESCURO NA TELA (APENAS PREVIEW) */
  .dark-mode .a4-page { background-color: #121212; color: #e2e8f0; }
  .dark-mode .doc-title { color: #f8fafc; }
  .dark-mode .meta-left, .dark-mode .meta-left .artist { color: #94a3b8; }
  .dark-mode .meta-left .separator { color: #475569; }
  .dark-mode .tone-badge { background: #1e293b; color: #38bdf8; }
  .dark-mode .cifra-content { color: #e2e8f0; }
  .dark-mode .chord { color: #fbbf24 !important; }
  .dark-mode hr.divider { border-top-color: #334155; }
  .dark-mode .split-col-divider { border-left-color: #334155; }

  /* Print Styles - Fixo e Seguro para A4 */
  @media print {
    @page { size: A4 portrait; margin: 0; }
    html, body { background: white !important; padding: 0 !important; margin: 0 !important; width: 100% !important; height: auto !important; overflow: visible !important; }
    .no-print, .preview-title { display: none !important; }
    .preview-section { margin: 0 !important; padding: 0 !important; }
    .a4-wrapper { gap: 0 !important; display: block !important; padding: 0 !important; margin: 0 !important; width: 100% !important; }
    
    .a4-page { 
        width: 210mm !important; height: 297mm !important; padding: 15mm 14mm 15mm 14mm !important; 
        box-shadow: none !important; margin: 0 auto !important; max-width: none !important;
        page-break-after: always !important; break-after: page !important; 
        page-break-inside: avoid !important; break-inside: avoid !important;
        box-sizing: border-box !important; background: white !important; overflow: hidden !important; 
    }
    .a4-page:last-child { page-break-after: avoid !important; break-after: avoid !important; }
    
    .dark-mode .a4-page { background-color: #121212 !important; color: #e2e8f0 !important; }
    .cifra-content { color: #000000 !important; }
    .dark-mode .cifra-content { color: #e2e8f0 !important; }
    .chord { color: #d97706 !important; font-weight: bold !important; }
    .dark-mode .chord { color: #fbbf24 !important; }
    .doc-title { color: #000000 !important; }
    .dark-mode .doc-title { color: #f8fafc !important; }
    .meta-left, .meta-left .artist { color: #475569 !important; }
    .dark-mode .meta-left, .dark-mode .meta-left .artist { color: #94a3b8 !important; }
    .dark-mode .meta-left .separator { color: #475569 !important; }
    .tone-badge { background: #e0f2fe !important; color: #0369a1 !important; }
    .dark-mode .tone-badge { background: #1e293b !important; color: #38bdf8 !important; }
    .dark-mode hr.divider { border-top-color: #334155 !important; }
    .dark-mode .split-col-divider { border-left-color: #334155 !important; }
    .badge, .tone-badge, .split-col-divider, .a4-page { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    .capo-text { color: #dc2626 !important; }
  }
</style>
</head>
<body>

<div class="no-print">
  <div class="header-actions">
    <div style="display: flex; align-items: center; gap: 15px;">
        <h1>JR Cifras</h1>
    </div>
    
    <div class="btn-group">
        <label for="file-upload" class="btn-primary btn-label" style="background:#475569; display: flex; align-items: center; justify-content: center; margin: 0;">📂 Abrir</label>
        <input type="file" id="file-upload" accept=".json" style="display:none" onchange="loadProject(event)">
        <button class="btn-primary" style="background:#0f766e;" onclick="saveProject()">💾 Salvar</button>
        <button class="btn-success" onclick="triggerPrint()">🖨️ Imprimir PDF</button>
        <button class="btn-primary" style="background:#e2e8f0; color: #1e293b;" id="btn-dark-mode" onclick="toggleDarkMode()">☀️ Modo Claro</button>
    </div>
  </div>
  
  <div class="songs-container">
    
    <div class="sidebar-wrapper">
      <button class="btn-primary" style="width: 100%; padding: 12px; font-size: 15px;" onclick="addNewSong()">➕ Nova Música</button>
      <div class="song-list-sidebar" id="song-list"></div>
    </div>

    <div class="editor-panel" id="editor-panel">
      <div class="grid">
        <div class="form-group" style="grid-column: span 2;">
          <label>Música</label>
          <input type="text" id="i-title" oninput="saveCurrentSong()">
        </div>
        
        <div class="form-group">
          <label>Artista / Ocasião</label>
          <input type="text" id="i-artist" oninput="saveCurrentSong()">
        </div>
        
        <div class="form-group" style="grid-column: span 2;">
          <label>Link Cifra (Ex: Cifra Club)</label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="i-cifra" placeholder="https://cifraclub.com.br..." oninput="saveCurrentSong()" style="flex: 1;">
            <button class="btn-warning" style="border: none; border-radius: 6px; padding: 10px; font-weight: bold; cursor: pointer;" onclick="fetchCifraClubData()" id="btn-fetch" title="Tentar puxar cifra via web">⬇️ Puxar</button>
          </div>
        </div>
        
        <div class="form-group">
          <label>Tom</label>
          <div class="transpose-controls">
              <input type="text" id="i-tone" oninput="saveCurrentSong()" style="width: 60px;">
              <button class="btn-transpose" onclick="changeTranspose(-1)">-</button>
              <span class="transpose-val" id="i-transpose-val">0</span>
              <button class="btn-transpose" onclick="changeTranspose(1)">+</button>
          </div>
        </div>
        
        <div class="form-group">
          <label>Capotraste</label>
          <input type="number" id="i-capo" placeholder="Ex: 3" oninput="saveCurrentSong()">
        </div>
        
        <div class="form-group">
          <label>Intro</label>
          <input type="text" id="i-intro" placeholder="Ex: G D Em C" oninput="saveCurrentSong()">
        </div>
      </div>
      
      <div class="text-areas">
        <div class="form-group">
          <label>Letra e Cifras</label>
          <div style="font-size: 13px; color: #475569; margin-bottom: 6px; background: #f1f5f9; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;">
            💡 <b>Colagem Inteligente Mobile:</b> Se o botão "Puxar" for bloqueado pelo site no celular, basta ir ao Cifra Club, copiar a letra toda e colar nesta caixa. Ela será limpa e formatada magicamente!
          </div>
          <textarea id="i-content" placeholder="Cole a cifra aqui..." oninput="saveCurrentSong()"></textarea>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="preview-section">
    <div class="preview-title no-print">👇 Pré Visualização da Música 👇</div>
    <div class="a4-wrapper" id="a4-wrapper"></div>
</div>

<script>
  let songs = [];
  let currentIndex = 0;
  let renderTimeout = null;
  let draggedItemIndex = null;
  let isDarkMode = false;

  function toggleDarkMode() {
      isDarkMode = !isDarkMode;
      const btn = document.getElementById('btn-dark-mode');
      const wrapper = document.getElementById('a4-wrapper');
      
      if (isDarkMode) {
          btn.innerHTML = '🌙 Modo Escuro';
          wrapper.classList.add('dark-mode');
          btn.style.background = '#1e293b';
          btn.style.color = 'white';
      } else {
          btn.innerHTML = '☀️ Modo Claro';
          wrapper.classList.remove('dark-mode');
          btn.style.background = '#e2e8f0';
          btn.style.color = '#1e293b';
      }
  }

  function triggerPrint() {
      // Bloqueio específico da Apple para PWAs
      const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
      if (isStandalone) {
          if (confirm("No modo 'App Instalado', a Apple desativa a caixa de impressão.\nDeseja abrir a página no navegador Safari para imprimir?")) { 
              window.open(window.location.href, '_blank'); 
          }
          return;
      }
      window.print();
  }

  function isChord(w) {
      const chordRegex = /^[A-G](#|b)?(m|M|maj|min|dim|aug|sus|add)?\d*(M|m)?\d*(\([^)]+\))?(º|°|\+|-)?(\/[A-G](#|b)?)?$/i;
      return chordRegex.test(w);
  }

  function isChordLineStr(line) {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith('[')) return false; 
      const words = trimmed.split(/\s+/);
      const chords = words.filter(isChord);
      return chords.length > 0 && chords.length >= words.length * 0.4;
  }

  const sharpNotes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const flatNotes = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

  function transposeSingleChord(chord, steps) {
      if (steps === 0) return chord;
      return chord.replace(/[A-G][#b]?/g, match => {
          let index = sharpNotes.indexOf(match);
          let useFlat = false;
          if (index === -1) { index = flatNotes.indexOf(match); useFlat = true; }
          if (index === -1) return match; 
          let newIndex = (index + steps) % 12;
          if (newIndex < 0) newIndex += 12;
          return useFlat ? flatNotes[newIndex] : sharpNotes[newIndex];
      });
  }

  function transposeLineText(line, steps) {
      if (steps === 0) return line;
      const wordExtractor = /(\S+)(\s*)/g;
      return line.replace(wordExtractor, (match, word, spaces) => {
          if (!isChord(word)) return match; 
          let newChord = transposeSingleChord(word, steps);
          let diff = newChord.length - word.length;
          let newSpaces = spaces;
          if (diff > 0 && newSpaces.length >= diff) newSpaces = newSpaces.slice(diff);
          else if (diff < 0) newSpaces = newSpaces + ' '.repeat(-diff);
          return newChord + newSpaces;
      });
  }

  function parseChords(text, steps = 0) {
    if (!text) return '';
    let globalIsBold = false; 
    const lines = text.split('\n');
    let blocks = [];
    let currentBlock = [];
    
    for (let line of lines) {
        if (line.trim().match(/^_{3,}$/) || line.trim().match(/^-{3,}$/)) {
            if (currentBlock.length > 0) { blocks.push(currentBlock); currentBlock = []; }
            blocks.push(line.trim());
        } else currentBlock.push(line);
    }
    if (currentBlock.length > 0) blocks.push(currentBlock);

    function processLines(linesArray) {
        while(linesArray.length > 0 && linesArray[0].trim() === '') linesArray.shift();
        while(linesArray.length > 0 && linesArray[linesArray.length - 1].trim() === '') linesArray.pop();
        let out = '';
        for (let line of linesArray) {
            const trimmed = line.trim();
            if (trimmed.toLowerCase() === '[b]') { globalIsBold = true; continue; }
            if (trimmed.toLowerCase() === '[/b]') { globalIsBold = false; continue; }
            if (!trimmed) { out += '\n'; continue; } 
            
            let isChordLine = isChordLineStr(line);
            let finalLine = isChordLine ? transposeLineText(line, steps) : line;
            let safeLine = finalLine.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\*(.*?)\*/g, '<b>$1</b>');
            
            if (isChordLine) out += `<span class="chord">${safeLine}</span>\n`;
            else out += globalIsBold ? `<b>${safeLine}</b>\n` : `${safeLine}\n`;
        }
        return out;
    }

    let html = '';
    for (let block of blocks) {
        if (typeof block === 'string') { html += '<hr class="divider">'; continue; }
        let splitIndex = -1;
        for (let i = 0; i < block.length; i++) {
            if (block[i].trim() === '|' || block[i].trim() === '||') { splitIndex = i; break; }
        }
        
        if (splitIndex !== -1) {
            html += '<div class="split-block">';
            html += '  <div class="split-col">' + processLines(block.slice(0, splitIndex)) + '</div>';
            html += '  <div class="split-col-divider"></div>';
            html += '  <div class="split-col">' + processLines(block.slice(splitIndex + 1)) + '</div>';
            html += '</div>';
        } else html += processLines(block);
    }
    return html;
  }

  function renderSongList() {
    const list = document.getElementById('song-list');
    list.innerHTML = '';
    
    songs.forEach((song, index) => {
      const div = document.createElement('div');
      div.className = `song-item ${index === currentIndex ? 'active' : ''}`;
      div.draggable = true;
      
      div.addEventListener('dragstart', (e) => { draggedItemIndex = index; e.dataTransfer.effectAllowed = 'move'; setTimeout(() => div.classList.add('dragging'), 0); });
      div.addEventListener('dragend', () => { div.classList.remove('dragging'); draggedItemIndex = null; });
      div.addEventListener('dragover', (e) => { e.preventDefault(); div.classList.add('drag-over'); });
      div.addEventListener('dragleave', () => { div.classList.remove('drag-over'); });
      div.addEventListener('drop', (e) => {
          e.preventDefault(); div.classList.remove('drag-over');
          if (draggedItemIndex === null || draggedItemIndex === index) return;
          const itemToMove = songs.splice(draggedItemIndex, 1)[0];
          songs.splice(index, 0, itemToMove);
          
          if (currentIndex === draggedItemIndex) currentIndex = index;
          else if (draggedItemIndex < currentIndex && index >= currentIndex) currentIndex--;
          else if (draggedItemIndex > currentIndex && index <= currentIndex) currentIndex++;
          
          renderSongList(); renderPreview();
      });
      
      div.onclick = () => selectSong(index);
      let toneSuffix = song.transposeSteps ? ` <span style="font-weight:normal; color:#64748b; font-size:12px;">(${song.transposeSteps > 0 ? '+' : ''}${song.transposeSteps})</span>` : '';
      
      const titleSpan = document.createElement('span');
      titleSpan.className = 'song-item-title';
      titleSpan.innerHTML = `<span class="drag-handle">☰</span> ${index + 1}. ${song.title || 'Nova'} ${toneSuffix}`;
      
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-danger'; delBtn.innerText = 'X';
      delBtn.onclick = (e) => { e.stopPropagation(); deleteSong(index); };
      
      div.appendChild(titleSpan); div.appendChild(delBtn); list.appendChild(div);
    });
  }

  function autoFitText() {
      const pages = document.querySelectorAll('.a4-page');
      pages.forEach(page => {
          const contentArea = page.querySelector('.a4-content-area');
          const contentBlock = page.querySelector('.cifra-content');
          if (!contentBlock || !contentArea) return;
          
          let min = 6.0, max = 22.0, best = min;
          for (let i = 0; i < 15; i++) {
              let mid = (min + max) / 2;
              contentBlock.style.fontSize = mid + 'pt';
              if (contentArea.scrollHeight > contentArea.clientHeight || contentArea.scrollWidth > contentArea.clientWidth) max = mid;
              else { best = mid; min = mid; }
          }
          contentBlock.style.fontSize = Math.max(6.0, best - 0.2) + 'pt';
      });
  }

  function renderPreview() {
    const wrapper = document.getElementById('a4-wrapper');
    wrapper.innerHTML = '';
    
    songs.forEach((song, idx) => {
      const page = document.createElement('div');
      page.className = 'a4-page' + (idx === currentIndex ? '' : ' hidden-preview');
      
      let capoText = ''; let capoValue = 0;
      if (song.capo && song.capo.trim() !== '') {
          let numeroCasa = song.capo.replace(/\D/g, ''); 
          if (numeroCasa !== '') {
              capoValue = parseInt(numeroCasa, 10);
              capoText = `<span class="capo-text" style="color: #dc2626; font-weight: 800; text-transform: uppercase; font-size: 16pt; white-space: nowrap;">CAPO NA ${numeroCasa}ª</span>`;
          }
      }
      
      let displayTone = song.tone || '';
      let totalToneSteps = (song.transposeSteps || 0) + capoValue;
      if (displayTone && totalToneSteps !== 0) displayTone = transposeSingleChord(displayTone, totalToneSteps);
      
      let introHtml = '';
      if (song.intro && song.intro.trim() !== '') {
          let transposedIntro = transposeLineText(song.intro.replace(/^\[?Intro\]?:?\s*/i, '').trim(), song.transposeSteps || 0);
          let colorizedIntro = transposedIntro.split(/(\s+)/).map(w => {
              if (w.trim() === '') return w;
              return isChord(w) ? `<span class="chord">${w}</span>` : w;
          }).join('');
          introHtml = `[Intro] ${colorizedIntro}\n\n`;
      }
      
      page.innerHTML = `
        <div class="a4-content-area">
            <div class="doc-header">
              <div class="doc-title">${song.title || 'Música Sem Título'}</div>
              <div class="doc-meta">
                <div class="meta-left" style="flex: 1; text-align: left;">
                  <span class="artist">${song.artist || ''}</span> <span class="separator">|</span> <span class="tone-badge">Tom: <span>${displayTone}</span></span>
                </div>
                <div style="flex: 1; display: flex; justify-content: center; align-items: center; text-align: center; min-width: max-content;">${capoText}</div>
                <div style="flex: 1;"></div>
              </div>
            </div>
            <div class="doc-body">
                <div class="cifra-content">${introHtml}${parseChords(song.content, song.transposeSteps || 0)}</div>
            </div>
        </div>`;
      wrapper.appendChild(page);
    });
    requestAnimationFrame(() => autoFitText());
  }

  function selectSong(index) {
    currentIndex = index; const song = songs[index];
    document.getElementById('i-title').value = song.title || '';
    document.getElementById('i-artist').value = song.artist || '';
    document.getElementById('i-tone').value = song.tone || '';
    document.getElementById('i-capo').value = song.capo || '';
    document.getElementById('i-intro').value = song.intro || '';
    document.getElementById('i-cifra').value = song.cifra || '';
    document.getElementById('i-content').value = song.content || '';
    
    let steps = song.transposeSteps || 0;
    document.getElementById('i-transpose-val').innerText = (steps > 0 ? '+' : '') + steps;
    document.getElementById('i-transpose-val').style.color = steps !== 0 ? '#dc2626' : '#0284c7';
    
    renderSongList(); renderPreview();
  }

  function saveCurrentSong() {
    if (songs.length === 0) return;
    songs[currentIndex] = {
      title: document.getElementById('i-title').value, artist: document.getElementById('i-artist').value,
      tone: document.getElementById('i-tone').value, capo: document.getElementById('i-capo').value,
      intro: document.getElementById('i-intro').value, cifra: document.getElementById('i-cifra').value,
      content: document.getElementById('i-content').value, transposeSteps: songs[currentIndex].transposeSteps || 0
    };
    renderSongList();
    clearTimeout(renderTimeout); renderTimeout = setTimeout(() => renderPreview(), 300);
  }
  
  function changeTranspose(delta) {
      if (songs.length === 0) return;
      let steps = (songs[currentIndex].transposeSteps || 0) + delta;
      if (steps > 11) steps = -11; if (steps < -11) steps = 11;
      songs[currentIndex].transposeSteps = steps;
      
      let valEl = document.getElementById('i-transpose-val');
      valEl.innerText = (steps > 0 ? '+' : '') + steps;
      valEl.style.color = steps !== 0 ? '#dc2626' : '#0284c7';
      renderSongList(); renderPreview();
  }

  function addNewSong() {
    songs.push({ title: 'Nova Música', artist: '', tone: '', capo: '', intro: '', cifra: '', content: '', transposeSteps: 0 });
    selectSong(songs.length - 1);
  }

  function deleteSong(index) {
    if (songs.length === 1) { alert("O repertório precisa ter pelo menos uma música."); return; }
    songs.splice(index, 1);
    if (currentIndex >= index && currentIndex > 0) currentIndex--;
    if (currentIndex >= songs.length) currentIndex = songs.length - 1;
    selectSong(currentIndex);
  }

  async function fetchCifraClubData() {
      let urlInput = document.getElementById('i-cifra').value.trim();
      const btn = document.getElementById('btn-fetch');
      
      if (!urlInput || !urlInput.includes('cifraclub')) {
          alert("Cole um link válido do Cifra Club."); return;
      }
      urlInput = urlInput.split('?')[0].split('#')[0];
      
      const originalText = btn.innerHTML;
      btn.innerHTML = "⏳...";
      btn.disabled = true;

      try {
          // No App, voltamos a usar o Proxy porque não temos a liberação nativa do Electron
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(urlInput)}`;
          const response = await fetch(proxyUrl);
          if (!response.ok) throw new Error("Proxy falhou.");
          
          const htmlText = await response.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, "text/html");
          
          let titleStr = "Nova Música", artistStr = "", tomStr = "";
          const pageTitle = doc.querySelector('title');
          if (pageTitle && pageTitle.textContent.includes('-')) {
              let parts = pageTitle.textContent.split('-');
              if (parts.length >= 2) { titleStr = parts[0].trim(); artistStr = parts[1].trim(); }
          }
          
          const tomRegex = doc.body.textContent.match(/Tom:\s*([A-G][#b]?m?)/i);
          if (tomRegex && tomRegex[1]) tomStr = tomRegex[1].trim();

          const preEl = doc.querySelector('pre');
          if (preEl) {
              preEl.querySelectorAll('.sr-only, script, style, [style*="display:none"], [style*="display: none"]').forEach(el => el.remove());
              let lines = preEl.textContent.replace(/\r/g, '').split('\n'), newLines = [], inIntroBlock = false, introChords = [];

              for (let line of lines) {
                  let upperLine = line.trim().toUpperCase();
                  if (upperLine.startsWith('[INTRO]') || upperLine === 'INTRO:' || upperLine === 'INTRO') {
                      inIntroBlock = true;
                      let inlineChords = line.replace(/\[?Intro\]?:?/i, '').trim();
                      if (inlineChords) introChords.push(inlineChords);
                      continue;
                  }
                  if (inIntroBlock) {
                      if (line.trim() === '' || line.trim().startsWith('[')) { inIntroBlock = false; newLines.push(line); } 
                      else introChords.push(line.trim());
                  } else newLines.push(line);
              }

              document.getElementById('i-content').value = newLines.join('\n').trim();
              document.getElementById('i-title').value = titleStr;
              document.getElementById('i-artist').value = artistStr;
              document.getElementById('i-tone').value = tomStr;
              document.getElementById('i-intro').value = introChords.join(' ').replace(/\s{2,}/g, ' ').trim();
              songs[currentIndex].transposeSteps = 0;
              document.getElementById('i-transpose-val').innerText = '0';
              document.getElementById('i-transpose-val').style.color = '#0284c7';
              
              saveCurrentSong(); alert("✅ Cifra extraída com sucesso!");
          } else alert("Não foi possível encontrar a cifra neste link.");
      } catch (error) {
          alert("O navegador mobile bloqueou a extração direta por segurança. Cole a cifra manualmente na caixa abaixo.");
      } finally {
          btn.innerHTML = originalText; btn.disabled = false;
      }
  }

  function saveProject() {
      if (songs.length === 0) { alert("Repertório vazio!"); return; }
      try {
          const jsonStr = JSON.stringify(songs, null, 2);
          const blob = new Blob([jsonStr], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = "meu_repertorio.json";
          document.body.appendChild(a); a.click();
          setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1000); // Essencial para iOS
      } catch (err) { alert("Erro ao salvar: " + err.message); }
  }

  function loadProject(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
          try {
              const loadedSongs = JSON.parse(e.target.result);
              if (Array.isArray(loadedSongs) && loadedSongs.length > 0) { songs = loadedSongs; currentIndex = 0; selectSong(0); } 
          } catch (err) { alert("Erro ao ler arquivo."); }
          event.target.value = '';
      };
      reader.readAsText(file);
  }

  document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('i-intro').addEventListener('paste', function(e) {
          e.preventDefault(); 
          const plain = e.clipboardData.getData('text/plain') || '';
          const html = e.clipboardData.getData('text/html') || '';
          let cleanText = plain;
          
          if (html && (html.toLowerCase().includes('cifraclub') || plain.includes('">'))) {
              let tempDiv = document.createElement('div'); tempDiv.innerHTML = html;
              tempDiv.querySelectorAll('.sr-only, [style*="display:none"], [style*="display: none"]').forEach(el => el.remove());
              cleanText = tempDiv.textContent || plain;
          }
          cleanText = cleanText.replace(/">/g, '').replace(/\u00A0/g, ' ').replace(/\[.*?\]/g, ' ').replace(/\r?\n/g, ' ').replace(/\s{2,}/g, ' ').trim();
          
          const start = this.selectionStart, end = this.selectionEnd;
          this.value = this.value.substring(0, start) + cleanText + this.value.substring(end);
          this.selectionStart = this.selectionEnd = start + cleanText.length;
          saveCurrentSong();
      });

      document.getElementById('i-content').addEventListener('paste', function(e) {
          const plain = e.clipboardData.getData('text/plain') || '';
          const html = e.clipboardData.getData('text/html') || '';
          
          if (html && (html.toLowerCase().includes('cifraclub') || plain.includes('">'))) {
              e.preventDefault(); 
              let tempDiv = document.createElement('div'); tempDiv.innerHTML = html;
              tempDiv.querySelectorAll('.sr-only, [style*="display:none"], [style*="display: none"]').forEach(el => el.remove());
              
              tempDiv.querySelectorAll('br').forEach(br => { br.parentNode.insertBefore(document.createTextNode('\n'), br); br.remove(); });
              tempDiv.querySelectorAll('div, p, pre, blockquote').forEach(block => block.appendChild(document.createTextNode('\n')));
              
              let cleanText = (tempDiv.querySelector('pre') ? tempDiv.querySelector('pre').textContent : tempDiv.textContent).replace(/">/g, '').replace(/\u00A0/g, ' ');
              let lines = cleanText.split(/\r?\n/), cleanedLines = [];
              
              for (let line of lines) {
                  if (line.trim() === '') {
                      if (cleanedLines.length === 0) continue;
                      if (isChordLineStr(cleanedLines[cleanedLines.length - 1])) continue; 
                      if (cleanedLines[cleanedLines.length - 1].trim() === '') continue;
                  }
                  cleanedLines.push(line.replace(/\r/g, ''));
              }
              while(cleanedLines.length > 0 && cleanedLines[cleanedLines.length - 1].trim() === '') cleanedLines.pop();
              
              let finalText = cleanedLines.join('\n');
              const start = this.selectionStart, end = this.selectionEnd;
              this.value = this.value.substring(0, start) + finalText + this.value.substring(end);
              this.selectionStart = this.selectionEnd = start + finalText.length;
              saveCurrentSong();
          }
      });
  });

  window.onload = () => {
    songs.push({ title: 'Nova Música', artist: '', tone: '', capo: '', intro: '', cifra: '', content: '', transposeSteps: 0 });
    selectSong(0); 
  };
</script>
